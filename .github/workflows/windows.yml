name: Windows package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install NSIS
        shell: pwsh
        run: |
          function Find-NsisExecutable {
            foreach ($baseDir in @(
              [Environment]::GetFolderPath('ProgramFilesX86'),
              [Environment]::GetFolderPath('ProgramFiles')
            )) {
              $candidate = Join-Path $baseDir 'NSIS\makensis.exe'
              if (Test-Path $candidate) {
                return $candidate
              }
            }
            return $null
          }

          $nsisExe = Find-NsisExecutable
          if (-not $nsisExe -and (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            winget install --id NSIS.NSIS --exact --silent --disable-interactivity --accept-package-agreements --accept-source-agreements
            $nsisExe = Find-NsisExecutable
          }
          if (-not $nsisExe -and (Get-Command choco.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
            $nsisExe = Find-NsisExecutable
          }
          if (-not $nsisExe) {
            throw "NSIS installation failed: makensis.exe is unavailable"
          }
          & $nsisExe /VERSION
          Split-Path -Parent $nsisExe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG
          $isRelease = $version -match "^v\d+\.\d+\.\d+$"
          if (-not $isRelease) {
            $version = "0.2.3-dev"
          } else {
            $version = $version.Substring(1)
            $project = Get-Content wails.json -Raw | ConvertFrom-Json
            $project.info.productVersion = $version
            $project | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8
          }
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.10.2 build --platform windows/amd64 --nsis --clean --ldflags "-X main.appVersion=$version"

      - name: Create update manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG
          if ($version -match "^v\d+\.\d+\.\d+$") {
            $version = $version.Substring(1)
          } else {
            $version = "0.2.3-dev"
          }
          $installer = Get-ChildItem -Path build/bin -Filter "*installer.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not produced"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $version
            downloadUrl = "https://github.com/China-520-1314/ciyuanshen-config-assistant/releases/download/v$version/$($installer.Name)"
            releaseNotes = "请查看本次 GitHub Release 说明"
            publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
            sha256 = $hash
          }
          $manifest | ConvertTo-Json | Set-Content -Path build/bin/update.json -Encoding utf8

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            build/bin/*-installer.exe
            build/bin/update.json
