# Included from the api.ciyuanshen.top server block. Keep this before the
# catch-all NewAPI proxy so release binaries are served by Nginx directly.
location = /downloads/ciyuanshen-config-assistant/update.json {
    alias /var/lib/ciyuanshen-config-assistant-downloads/update.json;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /downloads/ciyuanshen-config-assistant/releases/ {
    alias /var/lib/ciyuanshen-config-assistant-downloads/releases/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Do not let unknown download paths fall through to the NewAPI catch-all proxy.
location ^~ /downloads/ciyuanshen-config-assistant/ {
    return 404;
}
