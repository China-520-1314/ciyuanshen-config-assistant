# Included from the api.ciyuanshen.top server block. Keep this before the
# catch-all NewAPI proxy so release binaries are served by Nginx directly.

# A permanent shareable URL. Never cache the platform redirect or latest files.
location = /downloads/ciyuanshen-config-assistant/latest {
    set $assistant_download_platform windows.exe;
    if ($http_user_agent ~* "(Macintosh|Mac OS X)") {
        set $assistant_download_platform macos.dmg;
    }
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Vary "User-Agent" always;
    return 302 /downloads/ciyuanshen-config-assistant/latest/$assistant_download_platform;
}

location = /downloads/ciyuanshen-config-assistant/latest/windows.exe {
    alias /var/lib/ciyuanshen-config-assistant-downloads/latest/ciyuanshen-config-assistant-amd64-installer.exe;
    open_file_cache off;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="ciyuanshen-config-assistant-windows-latest.exe"' always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /downloads/ciyuanshen-config-assistant/latest/macos.dmg {
    alias /var/lib/ciyuanshen-config-assistant-downloads/latest/ciyuanshen-config-assistant-macos-universal.dmg;
    open_file_cache off;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="ciyuanshen-config-assistant-macos-universal-latest.dmg"' always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /downloads/ciyuanshen-config-assistant/latest/macos.zip {
    alias /var/lib/ciyuanshen-config-assistant-downloads/latest/ciyuanshen-config-assistant-macos-universal.zip;
    open_file_cache off;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="ciyuanshen-config-assistant-macos-universal-latest.zip"' always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /downloads/ciyuanshen-config-assistant/update.json {
    alias /var/lib/ciyuanshen-config-assistant-downloads/update.json;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /downloads/ciyuanshen-config-assistant/releases/ {
    alias /var/lib/ciyuanshen-config-assistant-downloads/releases/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Do not let unknown download paths fall through to the NewAPI catch-all proxy.
location ^~ /downloads/ciyuanshen-config-assistant/ {
    return 404;
}
